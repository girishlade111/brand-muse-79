<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brand Muse QA</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="brand-logo">
          <div class="brand-icon">⚡</div>
          <span>Brand Muse QA</span>
        </div>
        <div id="connection-status-badge" class="status-badge">Not Connected</div>
      </header>

      <!-- Connect Brand Kit Card -->
      <section id="connect-card" class="card">
        <div class="card-title">Connect Brand Kit</div>
        <div class="input-group">
          <label class="input-label" for="kit-input">Share Token or Kit ID</label>
          <input
            id="kit-input"
            class="input-field"
            type="text"
            placeholder="e.g. validShareToken... or UUID"
          />
        </div>
        <div class="input-group">
          <label class="input-label" for="host-input">Brand Muse Host (Optional)</label>
          <input id="host-input" class="input-field" type="text" value="http://localhost:5173" />
        </div>
        <button id="btn-connect" class="btn-primary">
          <span>🔗 Connect & Sync Kit</span>
        </button>
        <div
          id="connect-error"
          style="color: #ef4444; font-size: 11px; margin-top: 6px; display: none"
        ></div>
      </section>

      <!-- Active Kit Card (Hidden when disconnected) -->
      <section id="active-kit-card" class="card hidden">
        <div class="card-title">
          <span id="active-kit-name">Brand Kit</span>
          <button
            id="btn-disconnect"
            class="btn-secondary"
            style="padding: 2px 6px; font-size: 10px"
          >
            Disconnect
          </button>
        </div>

        <div style="font-size: 11px; color: #94a3b8; margin-bottom: 4px">Approved Colors</div>
        <div id="palette-swatches" class="palette-preview"></div>

        <div style="font-size: 11px; color: #94a3b8; margin-top: 10px; margin-bottom: 4px">
          Approved Typography
        </div>
        <div id="font-chips" class="font-chips"></div>
      </section>

      <!-- Audit Action Card (Active when kit connected) -->
      <section id="audit-action-card" class="card hidden">
        <button id="btn-audit" class="btn-primary" style="margin-bottom: 8px">
          <span>🔍 Audit Active Tab</span>
        </button>

        <div class="toggle-wrapper">
          <span style="font-size: 12px; font-weight: 500">Highlight Deviations</span>
          <label class="switch">
            <input type="checkbox" id="toggle-highlights" />
            <span class="slider"></span>
          </label>
        </div>
      </section>

      <!-- Audit Results Card (Hidden until audit complete) -->
      <section id="results-card" class="card hidden">
        <div class="card-title">Compliance Scorecard</div>

        <div class="score-overview">
          <div id="score-circle" class="score-badge-circle">
            <span id="score-overall" class="score-num">--</span>
            <span class="score-label">Score</span>
          </div>
          <div class="subscores-grid">
            <div class="subscore-item">
              <div id="score-color" class="subscore-val" style="color: #10b981">--</div>
              <div class="subscore-title">Colors</div>
            </div>
            <div class="subscore-item">
              <div id="score-font" class="subscore-val" style="color: #10b981">--</div>
              <div class="subscore-title">Fonts</div>
            </div>
            <div class="subscore-item">
              <div id="score-contrast" class="subscore-val" style="color: #10b981">--</div>
              <div class="subscore-title">Contrast</div>
            </div>
          </div>
        </div>

        <!-- Violation counts -->
        <div
          style="
            background: #1e293b;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 12px;
          "
        >
          <div style="display: flex; justify-content: space-between">
            <span style="color: #94a3b8">Off-Brand Colors (ΔE &gt; 5.0):</span>
            <span id="count-offbrand-colors" style="font-weight: 700; color: #ef4444">0</span>
          </div>
          <div style="display: flex; justify-content: space-between">
            <span style="color: #94a3b8">Unapproved Fonts:</span>
            <span id="count-unapproved-fonts" style="font-weight: 700; color: #f59e0b">0</span>
          </div>
          <div style="display: flex; justify-content: space-between">
            <span style="color: #94a3b8">WCAG Contrast Failures:</span>
            <span id="count-contrast-failures" style="font-weight: 700; color: #ec4899">0</span>
          </div>
        </div>

        <!-- Export Actions -->
        <div style="display: flex; gap: 8px">
          <button id="btn-export-json" class="btn-secondary" style="flex: 1">⬇ Export JSON</button>
          <button id="btn-export-pdf" class="btn-secondary" style="flex: 1">
            📄 1-Page PDF Report
          </button>
        </div>
      </section>
    </div>

    <script type="module" src="popup.ts"></script>
  </body>
</html>
